<table class="table table-hover" id="marksTable" th:fragment="marksTable" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
  <thead>
  <tr>
    <th scope="col">id</th>
    <th scope="col">Descripción</th>
    <th scope="col">Puntuación</th>
    <th scope="col"></th>
    <th scope="col"></th>
    <th scope="col"></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="mark : ${markList}">
    <td scope="row" th:text="${mark.id}">1</td>
    <td th:text="${mark.description}">Ejercicio 1</td>
    <td th:text="${mark.score}">10</td>
    <td><a th:href="@{'/mark/details/' + ${mark.id}}">Detalles</a></td>

    <!-- Modificar nota solo si es profesor -->
    <td sec:authorize="hasRole('ROLE_PROFESSOR')">
      <a th:href="@{'/mark/edit/' + ${mark.id}}">Modificar</a>
    </td>

    <!-- Para estudiantes: Reenviar o No reenviar -->
    <td sec:authorize="hasRole('ROLE_STUDENT')">
      <div th:if="${mark.resend}">
        <button type="button" th:id="'resendButton' + ${mark.id}" class="btn btn-success">Reenviar</button>
        <script th:inline="javascript">
          /*<![CDATA[*/
          $("#resendButton" + "[[${mark.id}]]").click(function() {
            $.get("/mark/[[${mark.id}]]/noresend", function() {
              let numberPage = [[${param.page}]];
              let urlUpdate = '/mark/list/update';
              if (numberPage != null) {
                urlUpdate += "?page=" + numberPage[0];
              }
              $("#marksTable").load(urlUpdate);
            });
          });
          /*]]>*/
        </script>
      </div>
      <div th:unless="${mark.resend}">
        <button type="button" th:id="'noresendButton' + ${mark.id}" class="btn btn-info">No reenviar</button>
        <script th:inline="javascript">
          /*<![CDATA[*/
          $("#noresendButton" + "[[${mark.id}]]").click(function() {
            $.get("/mark/[[${mark.id}]]/resend", function() {
              let numberPage = [[${param.page}]];
              let urlUpdate = '/mark/list/update';
              if (numberPage != null) {
                urlUpdate += "?page=" + numberPage[0];
              }
              $("#marksTable").load(urlUpdate);
            });
          });
          /*]]>*/
        </script>
      </div>
    </td>

    <!-- Eliminar nota solo si es profesor -->
    <td sec:authorize="hasRole('ROLE_PROFESSOR')">
      <a th:href="@{'/mark/delete/' + ${mark.id}}">Eliminar</a>
    </td>
  </tr>
  </tbody>
</table>
